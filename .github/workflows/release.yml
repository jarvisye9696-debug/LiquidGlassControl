name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - name: Verify translation coverage
        shell: pwsh
        run: ./verify-localization.ps1
      - name: Check version
        shell: pwsh
        run: |
          $script = Get-Content package.ps1 -Raw
          $version = [regex]::Match($script, '(?m)^\$version = ''([^'']+)''').Groups[1].Value
          if (-not $version -or $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.ps1 version' }
      - name: Prepare Windows framework headers
        shell: pwsh
        run: ./prepare-winrt.ps1
      - name: Configure
        run: cmake -S . -B build/cmake -A x64
      - name: Build
        run: cmake --build build/cmake --config Release
      - name: Self-test and package
        shell: pwsh
        run: ./package.ps1 -ExecutablePath build/cmake/Release/LiquidGlassControl.exe
      - name: Create draft with downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release create "$env:GITHUB_REF_NAME" @assets --verify-tag --draft --title "Liquid Glass Control $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
